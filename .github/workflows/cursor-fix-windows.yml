name: Cursor Fix Windows build

# Fork-only: builds the unsigned "T3 Code Cursor Fix" installer and publishes it
# as a release of this repository, which is also the app's update feed.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Plain semver for this build (for example 0.1.4). Bump it for every release so installed copies update."
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version }}
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Validate version
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be plain semver like 0.1.4, got '$VERSION'." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install
        run: vp install

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ inputs.version }}"

      - name: Build installer
        shell: bash
        run: node scripts/build-desktop-artifact.ts --platform win --target nsis --arch x64 --build-version "$VERSION" --verbose

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: t3code-cursor-fix-${{ inputs.version }}-win-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release/*.exe release/*.blockmap release/latest.yml)
          gh release create "v$VERSION" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "T3 Code Cursor Fix $VERSION" \
            --notes "Unsigned Windows build of T3 Code with the Cursor long-path fix. Installs next to the official app with its own data in ~/.t3-cursorfix."
